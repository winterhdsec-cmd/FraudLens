<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI反诈画像系统 功能模块图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
    padding: 50px 30px;
  }
  .tree {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .root {
    background: #1e3a5f;
    color: #fff;
    padding: 16px 40px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    position: relative;
  }
  .root::after {
    content: '';
    position: absolute;
    bottom: -30px;
    left: 50%;
    width: 2px;
    height: 30px;
    background: #94a3b8;
  }
  .branches {
    display: flex;
    gap: 14px;
    margin-top: 60px;
    position: relative;
  }
  .branches::before {
    content: '';
    position: absolute;
    top: -30px;
    left: 50px;
    right: 50px;
    height: 2px;
    background: #94a3b8;
  }
  .branch {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    min-width: 120px;
  }
  .branch::before {
    content: '';
    position: absolute;
    top: -30px;
    left: 50%;
    width: 2px;
    height: 30px;
    background: #94a3b8;
  }
  .branch-title {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    position: relative;
  }
  .branch-title::after {
    content: '';
    position: absolute;
    bottom: -22px;
    left: 50%;
    width: 2px;
    height: 22px;
    background: #cbd5e1;
  }
  .b1 .branch-title { background: #c0392b; }
  .b2 .branch-title { background: #8e44ad; }
  .b3 .branch-title { background: #2980b9; }
  .b4 .branch-title { background: #27ae60; }
  .b5 .branch-title { background: #d35400; }
  .b6 .branch-title { background: #16a085; }
  .b7 .branch-title { background: #7f8c8d; }
  .leaves {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 34px;
    align-items: center;
  }
  .leaf {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 11.5px;
    color: #334155;
    white-space: nowrap;
    text-align: center;
  }
</style>
</head>
<body>
<div class="tree">
  <div class="root">AI反诈画像系统</div>
  <div class="branches">

    <div class="branch b1">
      <div class="branch-title">数据接入层</div>
      <div class="leaves">
        <div class="leaf">案件信息录入</div>
        <div class="leaf">图片文档上传</div>
        <div class="leaf">CSV/Excel批量导入</div>
        <div class="leaf">OCR文字识别</div>
      </div>
    </div>

    <div class="branch b2">
      <div class="branch-title">智能研判引擎</div>
      <div class="leaves">
        <div class="leaf">6阶段研判流水线</div>
        <div class="leaf">案件要素提取</div>
        <div class="leaf">DeepSeek案情分析</div>
        <div class="leaf">视觉模型分析</div>
        <div class="leaf">信息智能清洗</div>
      </div>
    </div>

    <div class="branch b3">
      <div class="branch-title">团伙挖掘与画像</div>
      <div class="leaves">
        <div class="leaf">BGE语义嵌入聚类</div>
        <div class="leaf">HDBSCAN团伙发现</div>
        <div class="leaf">串并案智能推荐</div>
        <div class="leaf">七维度雷达画像</div>
        <div class="leaf">关联网络可视化</div>
      </div>
    </div>

    <div class="branch b4">
      <div class="branch-title">案件管理</div>
      <div class="leaves">
        <div class="leaf">案件总览看板</div>
        <div class="leaf">案件详情与状态</div>
        <div class="leaf">人员与账户管理</div>
        <div class="leaf">资金流向追踪</div>
        <div class="leaf">证据材料管理</div>
      </div>
    </div>

    <div class="branch b5">
      <div class="branch-title">预警与处置</div>
      <div class="leaves">
        <div class="leaf">实体比对预警</div>
        <div class="leaf">派单管理</div>
        <div class="leaf">重点人员管控</div>
      </div>
    </div>

    <div class="branch b6">
      <div class="branch-title">报告输出</div>
      <div class="leaves">
        <div class="leaf">研判报告生成</div>
        <div class="leaf">PDF/Word导出</div>
      </div>
    </div>

    <div class="branch b7">
      <div class="branch-title">系统管理</div>
      <div class="leaves">
        <div class="leaf">用户权限管理</div>
        <div class="leaf">操作审计日志</div>
        <div class="leaf">AI参数配置</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
