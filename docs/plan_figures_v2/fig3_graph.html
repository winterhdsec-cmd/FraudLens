<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1400px;height:800px;font-family:'Microsoft YaHei',sans-serif;background:#fff}
.hd{padding:18px 30px 6px;border-bottom:3px solid #0e2f52;display:flex;align-items:baseline;gap:14px}
.hd h1{font-size:25px;color:#0e2f52;font-family:'Microsoft YaHei'}
.hd span{font-size:13.5px;fill:#5b6b7c;color:#5b6b7c}
svg{display:block}
text{font-family:'Microsoft YaHei',sans-serif}
.legend{display:flex;gap:10px;padding:2px 30px 0;flex-wrap:wrap}
.lg{font-size:12px;color:#33475c;background:#f4f7fb;border:1px solid #dbe5f0;border-radius:14px;padding:5px 12px;display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%}
</style></head><body>
<div class="hd"><h1>诈骗团伙异构构图（示意）</h1><span>六类节点 · 5 条元路径 · HAN 注意力学习每条元路径权重 —— 灰点案件演示"话术相似但资金零重合→不误并"</span></div>
<svg viewBox="0 0 1400 580" width="1400" height="580">
  <!-- edges -->
  <g stroke-width="2">
    <!-- gang A red -->
    <g stroke="#d7a6a1">
      <line x1="190" y1="205" x2="1050" y2="105"/><line x1="190" y1="205" x2="1050" y2="215"/><line x1="190" y1="205" x2="1050" y2="325"/>
      <line x1="430" y1="115" x2="1050" y2="105"/><line x1="430" y1="235" x2="1050" y2="215"/><line x1="430" y1="115" x2="1050" y2="325"/>
      <line x1="700" y1="490" x2="1050" y2="105"/><line x1="700" y1="490" x2="1050" y2="215"/>
      <line x1="905" y1="105" x2="1050" y2="105"/><line x1="905" y1="105" x2="1050" y2="215"/><line x1="905" y1="105" x2="1050" y2="325"/>
    </g>
    <line x1="670" y1="150" x2="1050" y2="105" stroke="#c0392b" stroke-width="4"/>
    <line x1="670" y1="150" x2="1050" y2="215" stroke="#c0392b" stroke-width="4"/>
    <!-- gang B blue -->
    <g stroke="#a9c1dd">
      <line x1="190" y1="415" x2="1050" y2="415"/><line x1="190" y1="415" x2="1050" y2="505"/>
      <line x1="430" y1="385" x2="1050" y2="415"/><line x1="430" y1="385" x2="1050" y2="505"/>
      <line x1="905" y1="360" x2="1050" y2="415"/><line x1="905" y1="360" x2="1050" y2="505"/>
      <line x1="670" y1="300" x2="1050" y2="415" stroke="#1e5fa8" stroke-width="4"/>
      <line x1="670" y1="300" x2="1050" y2="505" stroke="#1e5fa8" stroke-width="4"/>
    </g>
    <!-- victims -->
    <g stroke="#8fd0bd" stroke-width="2">
      <line x1="1180" y1="330" x2="1050" y2="105"/><line x1="1250" y1="255" x2="1050" y2="215"/><line x1="1180" y1="330" x2="1050" y2="415"/>
    </g>
    <!-- C6 dashed near-miss -->
    <line x1="905" y1="105" x2="1255" y2="470" stroke="#9aa7b5" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="1255" y1="470" x2="1180" y2="330" stroke="#c9d3de" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <!-- edge annotations -->
  <text x="700" y="130" font-size="13" fill="#c0392b" font-weight="bold">共 享 账 户（强证据边）</text>
  <text x="1055" y="268" font-size="12.5" fill="#7a5b12" text-anchor="end">软权重语义边 w=0.93</text>
  <rect x="1120" y="516" width="270" height="56" rx="8" fill="#fff6e8" stroke="#d4a017"/>
  <text x="1255" y="539" font-size="13" fill="#8a5a00" text-anchor="middle" font-weight="bold">⚠ 话术撞脸但资金/号码零重合</text>
  <text x="1255" y="561" font-size="12.5" fill="#8a5a00" text-anchor="middle">双信号不一致 → 门控拒绝并入 A 团</text>
  <!-- city nodes -->
  <circle cx="160" cy="205" r="30" fill="#8b98a7"/><text x="160" y="211" font-size="14" fill="#fff" text-anchor="middle">城市</text>
  <circle cx="160" cy="415" r="30" fill="#8b98a7"/><text x="160" y="421" font-size="14" fill="#fff" text-anchor="middle">城市</text>
  <!-- phone nodes -->
  <circle cx="430" cy="115" r="27" fill="#d4a017"/><text x="430" y="121" font-size="13" fill="#fff" text-anchor="middle">号码</text>
  <circle cx="430" cy="235" r="27" fill="#d4a017"/><text x="430" y="241" font-size="13" fill="#fff" text-anchor="middle">号码</text>
  <circle cx="430" cy="385" r="27" fill="#d4a017"/><text x="430" y="391" font-size="13" fill="#fff" text-anchor="middle">号码</text>
  <!-- account nodes -->
  <circle cx="670" cy="150" r="29" fill="#c0392b"/><text x="670" y="156" font-size="13.5" fill="#fff" text-anchor="middle">账户</text>
  <circle cx="670" cy="300" r="29" fill="#c0392b"/><text x="670" y="306" font-size="13.5" fill="#fff" text-anchor="middle">账户</text>
  <!-- script nodes -->
  <circle cx="905" cy="105" r="31" fill="#7d5ba6"/><text x="905" y="111" font-size="13.5" fill="#fff" text-anchor="middle">话术</text>
  <circle cx="905" cy="360" r="31" fill="#7d5ba6"/><text x="905" y="366" font-size="13.5" fill="#fff" text-anchor="middle">话术</text>
  <!-- victim nodes -->
  <circle cx="1180" cy="330" r="24" fill="#2e9e77"/><text x="1180" y="336" font-size="13" fill="#fff" text-anchor="middle">受害人</text>
  <circle cx="1250" cy="255" r="20" fill="#2e9e77"/><text x="1250" y="260" font-size="11.5" fill="#fff" text-anchor="middle">人</text>
  <!-- case nodes: gang A -->
  <g><circle cx="1050" cy="105" r="34" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="1050" y="103" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">案件A</text><text x="1050" y="119" font-size="11" fill="#5b6b7c" text-anchor="middle">刷单返利</text></g>
  <g><circle cx="1050" cy="215" r="34" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="1050" y="213" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">案件A</text><text x="1050" y="229" font-size="11" fill="#5b6b7c" text-anchor="middle">刷单返利</text></g>
  <g><circle cx="1050" cy="325" r="34" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="1050" y="323" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">案件A</text><text x="1050" y="339" font-size="11" fill="#5b6b7c" text-anchor="middle">虚假投资</text></g>
  <!-- gang B -->
  <g><circle cx="1050" cy="415" r="32" fill="#fff" stroke="#1e5fa8" stroke-width="4"/><text x="1050" y="413" font-size="13" fill="#1e5fa8" text-anchor="middle" font-weight="bold">案件B</text><text x="1050" y="429" font-size="11" fill="#5b6b7c" text-anchor="middle">冒充公检法</text></g>
  <g><circle cx="1050" cy="505" r="32" fill="#fff" stroke="#1e5fa8" stroke-width="4"/><text x="1050" y="503" font-size="13" fill="#1e5fa8" text-anchor="middle" font-weight="bold">案件B</text><text x="1050" y="519" font-size="11" fill="#5b6b7c" text-anchor="middle">冒充公检法</text></g>
  <!-- near-miss case -->
  <g><circle cx="1255" cy="470" r="27" fill="#eef1f5" stroke="#9aa7b5" stroke-width="3" stroke-dasharray="5 4"/><text x="1255" y="467" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="bold">案件C</text><text x="1255" y="482" font-size="10.5" fill="#8b98a7" text-anchor="middle">独立</text></g>
</svg>
<div class="legend">
  <span class="lg"><span class="dot" style="background:#fff;border:3px solid #c0392b"></span>案件（同色描边=同一候选团伙）</span>
  <span class="lg"><span class="dot" style="background:#2e9e77"></span>受害人</span>
  <span class="lg"><span class="dot" style="background:#d4a017"></span>手机号</span>
  <span class="lg"><span class="dot" style="background:#c0392b"></span>收款账户</span>
  <span class="lg"><span class="dot" style="background:#7d5ba6"></span>话术模板</span>
  <span class="lg"><span class="dot" style="background:#8b98a7"></span>城市</span>
  <span class="lg" style="border-color:#1e5fa8;color:#1e5fa8">元路径1 案-账户-案（资金链·硬边）</span>
  <span class="lg" style="border-color:#b07a1e;color:#8a5a00">元路径2 案-号码-案（工具链·硬边）</span>
  <span class="lg" style="border-color:#7d5ba6;color:#7d5ba6">元路径3 案-话术-案（语义链·BGE余弦软权重边）</span>
  <span class="lg" style="border-color:#0e2f52;color:#0e2f52">+ 城市/受害人共现等结构路径</span>
</div>
</body></html>
