# G15：backend 上游（多副本时取消注释追加 server 行，并随 docker compose up --scale backend=N 扩展）
upstream backend-upstream {
    server backend:5003;
}

server {
    listen 80;
    server_name _;

    root /app/static;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    location /assets/ {
        root /app/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /api/ {
        proxy_pass http://backend-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 50m;
    }

    location /agent-analyze {
        proxy_pass http://backend-upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location /health {
        proxy_pass http://backend-upstream;
    }

    location /ws {
        proxy_pass http://backend-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

# ── G1 全链路 TLS ──
# 启用 HTTPS：运行 scripts/gen_tls.sh 生成自签证书并写入 tls.inc；
# tls.inc 为空时本 include 不产生任何 server（HTTP 明文仍可访问，不阻断）。
include /etc/nginx/conf.d/tls.inc;
