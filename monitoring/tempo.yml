# FraudLens — Grafana Tempo 配置（G10, docs/09 #C46）
# 轻量本地追踪存储，供 Grafana 通过 Tempo 数据源查询 span 树。
auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks

query_frontend:
  search:
    enabled: true
